name: "💡 Feature request"
description: "Suggest an improvement for Doci's Song Converter"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: "What slows you down or is missing in your workflow today?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: "What would you like it to do?"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: "Examples, references, or how often you'd use it."
    validations:
      required: false
